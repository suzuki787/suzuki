<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercedes-Benz Avtosaloni</title>
    <style>
        /* Asosiy dizayn (CSS) */
        body { 
            margin: 0; 
            background-color: #000; 
            color: #fff; 
            font-family: 'Arial', sans-serif; 
            text-align: center; 
        }
        .header { 
            padding: 40px 20px; 
            background: linear-gradient(to bottom, #1a1a1a, #000); 
            border-bottom: 2px solid #d4af37; 
        }
        h1 { color: #d4af37; text-transform: uppercase; letter-spacing: 3px; }
        .car-container { padding: 20px; }
        .card { 
            background: #111; 
            border: 1px solid #333; 
            padding: 20px; 
            margin: 20px auto; 
            max-width: 350px; 
            border-radius: 15px; 
            transition: 0.4s;
        }
        .card:hover { border-color: #d4af37; transform: scale(1.05); }
        .btn { 
            background: #d4af37; 
            color: #000; 
            padding: 12px 25px; 
            border: none; 
            border-radius: 5px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Mercedes-Benz</h1>
        <p>The Best or Nothing</p>
    </div>

    <div class="car-container">
        <div class="card">
            <h3>Mercedes S-Class</h3>
            <p>Hashamat va qulaylik.</p>
            <button class="btn" onclick="alert('Buyurtma qabul qilindi!')">Sotib olish</button>
        </div>
        <div class="card">
            <h3>Mercedes G-Wagon</h3>
            <p>Qudratli va zamonaviy.</p>
            <button class="btn" onclick="alert('Buyurtma qabul qilindi!')">Sotib olish</button>
        </div>
    </div>

</body>
</html>
