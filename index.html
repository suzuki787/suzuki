}

  transition:transform .15s ease-out;

}

.card-shimmer{

}
.card:hover .card-shimmer{transform:translateX(160%)}
.badge{

}
.card.door-open .door-path{

}

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let lang = 'uz';
let openDoor = null; // id of card with door open

// ═══════════════════════════════════════════════════════
//  RENDER GRID
// ═══════════════════════════════════════════════════════
function renderGrid() {
  const grid = document.getElementById('grid');
  const svgKeys = ['sclass','gwagon','amggt','maybach','eqs','eclass'];
  const l = I18N[lang];

  grid.innerHTML = CARS.map((car, i) => {
    const t = car[lang];
    const isOpen = openDoor === car.id;
    return `<div class="card${isOpen?' door-open':''}" id="card-${car.id}" data-id="${car.id}">
      <div class="card-inner">
        <div class="card-img">
          ${SVGS[svgKeys[i]]}
          <div class="card-shimmer"></div>
          <span class="badge">${car.badge}</span>
        </div>
        <div class="card-body">
          <div class="card-accent"></div>
          <h3 class="card-name">${t.name}</h3>
          <p class="card-sub">${t.sub}</p>
          <p class="card-desc">${t.desc}</p>
          <div class="card-specs">
            <div class="spec"><b>${car.specs.hp}</b><s>${l.hp}</s></div>
            <div class="spec"><b>${car.specs.t60}</b><s>${l.t60}</s></div>
            <div class="spec"><b>${car.specs.top}</b><s>${l.top}</s></div>
          </div>
          <div class="card-foot">
            <div>
              <span class="price-lbl">${t.from}</span>
              <span class="price-val">${car.price}</span>
            </div>
            <button class="btn-buy" data-car="${car.id}"><span>${t.buy}</span></button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  // Attach events
  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', handleCardClick);
    setupTilt(card);
  });
  grid.querySelectorAll('.btn-buy').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openModal(btn.dataset.car);
    });
  });
}

// ═══════════════════════════════════════════════════════
//  DOOR INTERACTION
// ═══════════════════════════════════════════════════════
function handleCardClick(e) {
  if (e.target.closest('.btn-buy')) return;
  const id = this.dataset.id;
  if (openDoor === id) {
    openDoor = null;
    this.classList.remove('door-open');
  } else {
    if (openDoor) {
      const prev = document.getElementById('card-' + openDoor);
      if (prev) prev.classList.remove('door-open');
    }
    openDoor = id;
    this.classList.add('door-open');
  }
}

// ═══════════════════════════════════════════════════════
//  3D TILT
// ═══════════════════════════════════════════════════════
function setupTilt(card) {
  const inner = card.querySelector('.card-inner');
  // Touch support
  card.addEventListener('touchmove', e => {
    const t = e.touches[0];
    const r = card.getBoundingClientRect();
    const x = (t.clientX - r.left) / r.width - 0.5;
    const y = (t.clientY - r.top) / r.height - 0.5;
    inner.style.transform = `rotateY(${x*10}deg) rotateX(${-y*7}deg)`;
  }, {passive:true});
  card.addEventListener('touchend', () => {
    inner.style.transform = '';
  }, {passive:true});
  // Mouse
  card.addEventListener('mousemove', e => {
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    inner.style.transform = `rotateY(${x*10}deg) rotateX(${-y*7}deg)`;
  });
  card.addEventListener('mouseleave', () => {
    inner.style.transform = '';
  });
}

// ═══════════════════════════════════════════════════════
//  LANGUAGE SWITCHER
// ═══════════════════════════════════════════════════════
function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === l);
  });
  const t = I18N[l];
  // Update static i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (t[key] !== undefined) el.innerHTML = t[key];
  });
  // Re-render grid (preserves door state)
  renderGrid();
}

// ═══════════════════════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════════════════════
function openModal(carId) {
  const car = CARS.find(c => c.id === carId);
  const t = car[lang];
  document.getElementById('m-title').textContent = t.name;
  document.getElementById('m-body').innerHTML = t.mtxt;
  document.getElementById('m-cta').textContent = t.mcta;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  // Update config subtitle
  const sub = document.querySelector('[data-i18n="config"]');
  if (sub) sub.textContent = I18N[lang].config;
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

// Telegram WebApp integration
if (window.Telegram && window.Telegram.WebApp) {
  const twa = window.Telegram.WebApp;
  twa.ready();
  twa.expand();
  twa.setHeaderColor('#080808');
  twa.setBackgroundColor('#080808');
}

// ─── INIT ───
renderGrid();
</script>
